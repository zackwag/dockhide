name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Attach script to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dockhide --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Open Homebrew tap update PR
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 dockhide | awk '{print $1}')
          BRANCH="update-dockhide-${VERSION}"

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/zackwag/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          git checkout -b "$BRANCH"

          # Rewrites only the url's tag segment and sha256 so hand edits to the
          # rest of the formula (caveats, test) survive releases.
          sed -i '' -E "s#(releases/download/v)[0-9]+\.[0-9]+\.[0-9]+(/dockhide)#\1${VERSION}\2#" Formula/dockhide.rb
          sed -i '' -E "s/sha256 \".*\"/sha256 \"${SHA}\"/" Formula/dockhide.rb

          grep -q "v${VERSION}/dockhide" Formula/dockhide.rb || {
            echo "::error::url in Formula/dockhide.rb was not updated to v${VERSION}"
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dockhide.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(dockhide): update to ${VERSION}"
          git push origin "$BRANCH"

          GH_TOKEN="$TAP_TOKEN" gh pr create --repo zackwag/homebrew-tap --base main --head "$BRANCH" \
            --title "chore(dockhide): update to ${VERSION}" \
            --body "Automated update from a dockhide release."
